appId: com.anonymous.mobile
---
# Launch app and sign in as Sales Executive
- launchApp:
    clearState: false

- assertVisible:
    text: "Sign In.*"
    optional: true

- tapOn:
    text: "agent@brokeros.com"
    optional: true
- inputText: "salesexec1@demo.com"

- tapOn:
    text: "••••••••"
    optional: true
- inputText: "Demo@1234"

- tapOn:
    text: "Select Assigned Role Identity"
    optional: true

- tapOn:
    text: "Sales Executive.*"
    optional: true

- tapOn:
    text: "Sign In to BrokerOS"
    optional: true

- assertVisible:
    text: ".*Sales Executive.*"
